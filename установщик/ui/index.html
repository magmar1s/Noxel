<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Установка Noxel</title>
<style>
:root{color-scheme:dark;--fg:#f6f6f7;--fg2:rgba(255,255,255,.64);--fg3:rgba(255,255,255,.38);--fg4:rgba(255,255,255,.16);--line:rgba(255,255,255,.11);--line2:rgba(255,255,255,.2);--fill:rgba(255,255,255,.055);--fill2:rgba(255,255,255,.1);--ink:#050506;
 --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--font:"Inter","SF Pro Display","Noto Sans","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono","Noto Sans Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--fg);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased;user-select:none}
button,input{font:inherit;color:inherit;border:0;background:none;outline:none}button{cursor:pointer}button:disabled{cursor:default}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(700px 500px at 10% -10%,#2a2a2e,transparent 62%),radial-gradient(640px 560px at 105% 110%,#242428,transparent 58%),linear-gradient(180deg,#0a0a0b,#050506)}
#bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);animation:drift 24s ease-in-out infinite alternate}
#bg .a{width:420px;height:420px;left:5%;top:20%}#bg .b{width:360px;height:360px;right:2%;top:50%;animation-delay:-9s}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(60px,-40px) scale(1.12)}}
.wrap{position:relative;height:100%;padding:14px}
.card{position:relative;height:100%;border-radius:26px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.012)),rgba(12,12,14,.76);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 24px 60px -12px rgba(0,0,0,.6);display:grid;grid-template-columns:230px 1fr;overflow:hidden}
.side{padding:34px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;border-right:1px solid var(--line);background:rgba(0,0,0,.18)}
.logo{width:96px;height:96px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.6));animation:float 6s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-8px) rotate(2deg)}}
.side h1{font-size:22px;font-weight:700;letter-spacing:.3em;padding-left:.3em}
.side p{font-size:12px;color:var(--fg3);text-align:center;line-height:1.5}
.steps{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--fg3)}
.steps div{display:flex;align-items:center;gap:10px;transition:color .3s}.steps b{width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;font-weight:600;transition:all .4s var(--spring)}
.steps .on{color:var(--fg)}.steps .on b{background:#fff;color:var(--ink);border-color:#fff;transform:scale(1.12)}.steps .done b{background:var(--fill2)}
.main{position:relative;padding:34px 36px;display:flex;flex-direction:column;min-width:0}
.page{display:none;flex:1;flex-direction:column;min-height:0;animation:pin .55s var(--ease) both}.page.on{display:flex}
@keyframes pin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h2{font-size:26px;font-weight:700;letter-spacing:-.03em}.sub{color:var(--fg3);margin-top:6px;font-size:13px}
.opts{overflow:auto;max-height:360px;margin-top:20px;display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 14px;border-radius:14px;cursor:pointer;transition:background .25s}
.opt:focus-visible{outline:2px solid white}.opt:hover{background:var(--fill)}.opt b{display:block;font-weight:550;font-size:13.5px}.opt small{display:block;color:var(--fg3);font-size:12px;margin-top:2px}
.sw{position:relative;width:42px;height:25px;border-radius:25px;flex:none;background:var(--fill2);border:1px solid var(--line);transition:background .3s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:var(--fg3);transition:transform .4s var(--spring),background .3s}
.sw.on{background:rgba(255,255,255,.28)}.sw.on::after{transform:translateX(17px);background:#fff;box-shadow:0 0 10px rgba(255,255,255,.6)}
.dir{margin-top:14px}.dir label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.inp{width:100%;height:40px;margin-top:7px;padding:0 14px;border-radius:13px;background:rgba(0,0,0,.28);border:1px solid var(--line);user-select:text;font-size:12.5px;transition:border-color .25s}.inp:focus{border-color:var(--line2)}
.foot{margin-top:auto;display:flex;justify-content:flex-end;gap:10px;padding-top:16px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:14px;background:var(--fill2);border:1px solid var(--line);font-weight:600;font-size:13.5px;transition:transform .3s var(--spring),background .25s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.16)}.btn:active{transform:scale(.96)}
.btn.solid{background:linear-gradient(180deg,#fff,#d6d6d9);color:var(--ink);border-color:#fff;box-shadow:0 0 40px -8px rgba(255,255,255,.4)}.btn.solid:hover{background:#fff}.btn:disabled{opacity:.5;pointer-events:none}
.pct{font-size:56px;font-weight:700;letter-spacing:-.04em;margin-top:26px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:10px;background:var(--fill2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,.5),#fff);transition:width .35s var(--ease);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-100%);animation:sheen 1.5s linear infinite}
@keyframes sheen{to{transform:translateX(100%)}}
.stage{margin-top:16px;font-weight:600;font-size:15px}.detail{color:var(--fg3);font-size:12.5px;margin-top:4px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{margin-top:18px;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--fg3)}.log div{display:flex;gap:9px;align-items:center;animation:pin .4s var(--ease) both}.log svg{width:14px;height:14px;color:#fff}
.big{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink);box-shadow:0 0 60px -6px rgba(255,255,255,.5);animation:pop .7s var(--spring)}.big svg{width:42px;height:42px;stroke-width:2.2}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.err{margin-top:16px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line2);font-size:12.5px;color:var(--fg2);line-height:1.5;user-select:text;word-break:break-word}
</style>
</head>
<body>
<div id="bg"><i class="a"></i><i class="b"></i></div>
<div class="wrap"><div class="card">
  <aside class="side">
    <svg class="logo" viewBox="0 0 512 512"><path d="M256 92 392 170 256 248 120 170Z" fill="#f4f4f5"/><path d="M120 170 256 248V420L120 342Z" fill="#8a8a90"/><path d="M392 170 256 248V420L392 342Z" fill="#35353a"/></svg>
    <h1>NOXEL</h1><small>Автор: magmar1s · MIT · открытый код</small><p>Лаунчер Minecraft, где у каждой версии свои моды</p>
    <div class="steps"><div id="s1" class="on"><b>1</b>Параметры</div><div id="s2"><b>2</b>Установка</div><div id="s3"><b>3</b>Готово</div></div>
  </aside>
  <section class="main">
    <div class="page on" id="p1">
      <h2>Установка Noxel</h2><div class="sub" id="ver">Проверяю выпуск на GitHub…</div>
      <div class="opts" id="opts"></div>
      <div class="dir"><label>Папка установки</label><input class="inp" id="dir" spellcheck="false"></div>
      <div class="foot"><button class="btn" id="bClose">Отмена</button><button class="btn solid" id="bGo" disabled>Установить</button></div>
    </div>
    <div class="page" id="p2">
      <h2>Устанавливаю…</h2><div class="sub">Это займёт пару минут, окно можно не трогать</div>
      <div class="pct" id="pct">0%</div><div class="bar"><i id="fill"></i></div>
      <div class="stage" id="stage">Подготовка</div><div class="detail" id="detail"></div>
      <div class="log" id="log"></div>
    </div>
    <div class="page" id="p3" style="align-items:center;justify-content:center;text-align:center;gap:6px">
      <div class="big" id="bigicon"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
      <h2 id="doneT" style="margin-top:20px">Noxel установлен</h2><div class="sub" id="doneS">Ярлыки созданы, можно играть.</div>
      <div class="err" id="errBox" style="display:none;max-width:420px"></div>
      <div class="foot" style="margin-top:26px;padding:0;justify-content:center"><button class="btn" id="bExit">Закрыть</button><button class="btn solid" id="bRun">Запустить Noxel</button></div>
    </div>
  </section>
</div></div>
<script>
const T = window.__TAURI__, invoke = (c, a) => T.core.invoke(c, a || {}), $ = s => document.querySelector(s);
const st = {menu: true, desktop: true, java: false, game: false, horizon: false, run: true}; let exe = '';
const OPTS = [['menu','Ярлык в меню приложений','Noxel появится в списке программ'],['desktop','Ярлык на рабочем столе','Запуск одним кликом'],['java','Скачать Java сейчас','Около 200 МБ. Иначе скачается при первом запуске игры'],['game','Скачать последнюю версию Minecraft','Около 600 МБ. Сократит загрузку при первом запуске'],['horizon','Скачать Horizon на Rust','Клиент и актуальная сборка. Файлы Minecraft 26.3 подготавливаются отдельно из своей копии игры'],['run','Запустить Noxel после установки','']];
function drawOpts(){ $('#opts').innerHTML = OPTS.map(([k, t, d]) => `<div class="opt" role="checkbox" tabindex="0" aria-checked="${!!st[k]}" data-k="${k}"><div><b>${t}</b>${d ? `<small>${d}</small>` : ''}</div><div class="sw ${st[k] ? 'on' : ''}"></div></div>`).join('');
  document.querySelectorAll('.opt').forEach(o => { o.onclick = () => { const key = o.dataset.k; st[key] = !st[key]; drawOpts(); document.querySelector('[data-k="' + key + '"]').focus(); }; o.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); o.click(); } }; }); }
function step(n){ ['1','2','3'].forEach(i => { const e = $('#s' + i); e.className = +i < n ? 'done' : +i === n ? 'on' : ''; }); document.querySelectorAll('.page').forEach((p, i) => p.classList.toggle('on', i === n - 1)); }
const seen = new Set();
function note(stage){ if (seen.has(stage)) return; seen.add(stage); const d = document.createElement('div'); d.innerHTML = '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' + stage; $('#log').prepend(d); while ($('#log').children.length > 5) $('#log').lastChild.remove(); }
T.event.listen('setup', ({payload: p}) => {
  const f = Math.max(0, Math.min(1, p.frac)); $('#fill').style.width = f * 100 + '%'; $('#pct').textContent = Math.round(f * 100) + '%';
  $('#stage').textContent = p.stage; $('#detail').textContent = p.detail || ''; note(p.stage);
});
T.event.listen('setup-done', ({payload: p}) => {
  step(3);
  if (p.ok) { exe = p.exe; $('#bRun').style.display = st.run ? '' : 'none'; }
  else { $('#bigicon').innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>'; $('#doneT').textContent = 'Не получилось установить'; $('#doneS').textContent = 'Проверь интернет и попробуй ещё раз.'; $('#errBox').style.display = ''; $('#errBox').textContent = p.error; $('#bRun').textContent = 'Повторить'; $('#bRun').onclick = () => { seen.clear(); $('#log').innerHTML = ''; begin(); }; }
});
function begin(){ step(2); $('#fill').style.width = '0'; invoke('start', {opts: {dir: $('#dir').value, menu: st.menu, desktop: st.desktop, java: st.java, game: st.game, horizon: st.horizon, run: st.run}}); }
$('#bGo').onclick = begin; $('#bClose').onclick = () => invoke('finish', {run: false, exe: ''}); $('#bExit').onclick = () => invoke('finish', {run: false, exe: ''});
$('#bRun').onclick = () => invoke('finish', {run: true, exe});
drawOpts();
invoke('plan').then(p => { $('#dir').value = p.dir; $('#ver').textContent = `Версия ${p.version}${p.size ? ' · ' + (p.size / 1e6).toFixed(1) + ' МБ' : ''}${p.installed ? ' · уже установлен, будет обновлён' : ''}`; $('#bGo').disabled = false; if (p.installed) $('#bGo').textContent = 'Обновить'; if (p.auto !== null && p.auto !== undefined) { st.java = p.auto.includes('java'); st.game = p.auto.includes('game'); st.horizon = p.auto.includes('horizon'); st.run = false; begin(); } })
  .catch(e => { $('#ver').textContent = String(e); });
</script>
</body>
</html>
