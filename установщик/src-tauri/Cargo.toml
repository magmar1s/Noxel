[package]
authors = ["magmar1s"]
license = "MIT"
repository = "https://github.com/magmar1s/Noxel"
name = "noxel-setup"
version = "0.1.0"
description = "Установщик Noxel"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
ring = "0.17"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
