# Noxel: HTTPS-прокси для API и раздача скинов. Сертификат добавляет certbot.
server_tokens off;
limit_req_zone $binary_remote_addr zone=noxel_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mr1s.site www.mr1s.site;

    # сайт
    root /var/www/noxel-site;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(webp|png|svg|css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # скины и плащи: имя файла = sha256 содержимого, поэтому кэшируем навсегда
    location ^~ /noxel/f/ {
        alias /var/lib/noxel/files/;
        default_type image/png;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Access-Control-Allow-Origin *;
    }

    # сборки лаунчера для самообновления
    location ^~ /noxel/dl/ {
        alias /var/lib/noxel/dl/;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    # страница общей ссылки на мир: /w/<ссылка>
    location ~ ^/w/[A-Za-z0-9_-]+$ {
        try_files /w.html =404;
    }

    # страница сборки по коду: /p/<код>
    location ~ ^/p/[A-Za-z0-9]+$ {
        try_files /p.html =404;
    }

    location /noxel/ {
        limit_req zone=noxel_api burst=40 nodelay;
        client_max_body_size 600k;
        proxy_pass http://127.0.0.1:8730;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
