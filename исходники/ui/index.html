<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Noxel</title>
<style>
:root{
  color-scheme:dark;
  --fg:#f6f6f7; --fg2:rgba(255,255,255,.64); --fg3:rgba(255,255,255,.38); --fg4:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.2);
  --fill:rgba(255,255,255,.055); --fill2:rgba(255,255,255,.1); --fill3:rgba(255,255,255,.16);
  --ink:#050506; --r1:28px; --r2:18px; --r3:12px;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Inter","SF Pro Display","Noto Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono","Noto Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--fg);font:14px/1.35 var(--font);-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
button:disabled{cursor:default}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
html.still *,html.still *::before,html.still *::after{animation:none!important;transition:none!important}
/* лёгкий режим: без размытия фона под панелями и без тяжёлых теней, живой фон не двигается; окно в фоне и игра на экране ничего не рисуют */
html.lite .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.012)),linear-gradient(rgba(13,13,15,.93),rgba(13,13,15,.93));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 24px -14px rgba(0,0,0,.6)}
html.lite #bg .orb{filter:none;animation:none;will-change:auto}
html.lite #modal,html.lite #xmodal{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(0,0,0,.72)}
html.idle :is(.nbtn.upd,.racc i.busy,.spinner,.sk,.bar i,.bar i::after,.stage .art svg,#drop svg,.sw-a,.sw-b,.sw-n,.rail-acc>i.busy,.live i,.ibtn.spin svg){animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── фон: серые градиенты и медленно плывущие пятна ── */
#bg{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(900px 620px at 12% -8%,#2a2a2e 0%,rgba(42,42,46,0) 62%),
  radial-gradient(820px 700px at 104% 108%,#242428 0%,rgba(36,36,40,0) 58%),
  linear-gradient(180deg,#0a0a0b,#050506)}
#bg .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;background:radial-gradient(circle,rgba(255,255,255,.2),rgba(255,255,255,0) 70%);animation:drift 26s ease-in-out infinite alternate}
#bg .o1{width:520px;height:520px;left:6%;top:14%}
#bg .o2{width:460px;height:460px;right:4%;top:48%;animation-duration:34s;animation-delay:-9s;opacity:.38}
#bg .o3{width:380px;height:380px;left:44%;top:-8%;animation-duration:30s;animation-delay:-16s;opacity:.3}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-50px) scale(1.15)}100%{transform:translate(-50px,60px) scale(.92)}}
#bg::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(70% 70% at 50% 40%,#000,transparent);mask-image:radial-gradient(70% 70% at 50% 40%,#000,transparent)}
#app{position:relative;height:100%;display:grid;grid-template-columns:90px 1fr;gap:14px;padding:14px}

/* ── заставка ── */
#splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;align-content:center;gap:22px;background:#050506;transition:opacity .7s var(--ease),visibility .7s}
#splash.gone{opacity:0;visibility:hidden}
#splash svg{width:96px;height:96px;stroke:none;overflow:visible}
#splash .f{opacity:0;animation:face .8s var(--ease) forwards}
#splash .f1{animation-delay:.15s;--dx:0px;--dy:-40px}
#splash .f2{animation-delay:.35s;--dx:-40px;--dy:20px}
#splash .f3{animation-delay:.55s;--dx:40px;--dy:20px}
@keyframes face{from{opacity:0;transform:translate(var(--dx),var(--dy))}to{opacity:1;transform:none}}
#splash .wm{font-size:15px;font-weight:650;letter-spacing:.6em;padding-left:.6em;color:var(--fg2);opacity:0;animation:wm 1s var(--ease) .7s forwards}
@keyframes wm{from{opacity:0;letter-spacing:1.2em}to{opacity:1;letter-spacing:.6em}}

/* ── стекло ── */
.glass{position:relative;border-radius:var(--r1);
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.012)),linear-gradient(rgba(12,12,14,.74),rgba(12,12,14,.74));
  border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(255,255,255,.03),0 24px 60px -12px rgba(0,0,0,.6)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s var(--ease);
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.08),transparent 65%)}
.glass:hover::before{opacity:1}

/* ── рейка ── */
.rail{display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;border-radius:36px}
.mark{width:36px;height:36px;margin-bottom:14px;transition:transform .6s var(--spring)}
.mark:hover{transform:rotate(-8deg) scale(1.12)}
.mark svg{width:36px;height:36px;stroke:none}
.nav{position:relative;display:flex;flex-direction:column;gap:4px}
.nav-pill{position:absolute;left:-8px;top:0;width:3px;height:22px;border-radius:3px;background:var(--fg);box-shadow:0 0 14px rgba(255,255,255,.7);
  transition:transform .5s var(--spring);transform:translateY(var(--y,13px))}
.nbtn.upd{color:#fff;background:rgba(255,255,255,.14);margin-bottom:6px;animation:updp 2.2s ease-in-out infinite}
.nbtn.upd[hidden]{display:none}
@keyframes updp{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 7px rgba(255,255,255,0)}}
.nbtn.has-new::after{content:'';position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
.ncard{padding:18px 20px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ncard.imp{border-color:rgba(255,255,255,.4)}.ncard.pin{background:rgba(255,255,255,.08)}
.ncard h3{margin:0;font-size:17px}.ncard .nb{white-space:pre-wrap;color:var(--fg2);font-size:13.5px;line-height:1.5;user-select:text}
.nbtn{position:relative;width:70px;height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--fg3);
  transition:background .25s var(--ease),color .25s var(--ease),transform .35s var(--spring)}
.rail{overflow-y:auto;scrollbar-width:none}
@media (max-height:780px){.nbtn{height:50px;gap:3px}.mark{margin-bottom:8px}.rail{padding:12px 0}}
.nbtn .lbl{font-size:10.5px;font-weight:600;letter-spacing:.01em;line-height:1;white-space:nowrap}
.nbtn .tip{display:none}
.nbtn[data-p=home]:not(.on){color:#fff;background:rgba(255,255,255,.1);box-shadow:0 0 20px -4px rgba(255,255,255,.4)}
.nbtn svg{width:21px;height:21px;transition:transform .35s var(--spring)}
.nbtn:hover{background:var(--fill2);color:var(--fg)}
.nbtn:hover svg{transform:scale(1.14) translateY(-1px)}
.nbtn:active{transform:scale(.92)}
.nbtn.on{color:var(--fg);background:var(--fill2)}
.tip{position:absolute;left:58px;padding:6px 11px;border-radius:10px;background:rgba(14,14,16,.95);border:1px solid var(--line);font-size:12px;white-space:nowrap;
  opacity:0;transform:translateX(-6px);pointer-events:none;transition:opacity .2s,transform .3s var(--ease);z-index:50}
.nbtn:hover .tip,.racc:hover .tip{opacity:1;transform:none;transition-delay:.25s}
.rail .grow{flex:1}
.racc{position:relative;width:42px;height:42px;border-radius:14px;margin-bottom:6px;display:grid;place-items:center;font-weight:700;font-size:15px;
  background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.05));border:1px solid var(--line2);transition:transform .35s var(--spring)}
.racc:hover{transform:scale(1.1) rotate(-4deg)}
.racc i{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--fg4);border:2px solid #0d0d0f;transition:background .4s,box-shadow .4s}
.racc i.on{background:#fff;box-shadow:0 0 10px 2px rgba(255,255,255,.7)}
.racc i.busy{background:#fff;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* ── страницы ── */
#pages{position:relative;min-width:0;min-height:0}
.page{position:absolute;inset:0;min-height:0}
.page:not(.on){display:none}
.page.on{display:grid;animation:pin .6s var(--ease) both}
@keyframes pin{from{opacity:0;transform:translateY(12px) scale(.99);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
#p-home,#p-versions,#p-accounts{grid-template-columns:minmax(330px,380px) 1fr;gap:14px}
#p-mods,#p-settings{grid-template-columns:1fr}

/* ── списки ── */
.list{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lhead{padding:20px 18px 12px;display:flex;flex-direction:column;gap:12px}
.ltitle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ltitle h2{font-size:22px;font-weight:650;letter-spacing:-.02em}
.ltitle h2 small{font-size:12px;font-weight:500;color:var(--fg3);margin-left:8px;letter-spacing:0}
.search{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);transition:border-color .25s,background .25s}
.search:focus-within{border-color:var(--line2);background:rgba(0,0,0,.4)}
.search svg{width:17px;height:17px;color:var(--fg3);flex:none}
.search input{flex:1;min-width:0;user-select:text}
.search input::placeholder{color:var(--fg3)}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--fg2);flex:none;transition:background .25s var(--ease),color .2s,transform .3s var(--spring)}
.ibtn svg{width:18px;height:18px;transition:transform .4s var(--spring)}
.ibtn:hover{background:var(--fill2);color:var(--fg)}
.ibtn:hover svg{transform:scale(1.12)}
.ibtn:active{transform:scale(.9)}
.ibtn.sm{width:30px;height:30px;border-radius:10px}.ibtn.sm svg{width:15px;height:15px}
.ibtn.spin svg{animation:spin .8s linear infinite}
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;padding:0 10px 14px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

.row{position:relative;display:flex;align-items:center;gap:12px;height:62px;padding:0 10px 0 12px;border-radius:16px;cursor:pointer;margin-bottom:2px;
  transition:background .25s var(--ease),transform .35s var(--ease);animation:rin .5s var(--ease) both;animation-delay:calc(var(--i,0)*16ms)}
@keyframes rin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.row:hover{background:var(--fill);transform:translateX(3px)}
.row.sel{background:var(--fill2)}
.row.sel::before{content:"";position:absolute;left:3px;top:15px;bottom:15px;width:3px;border-radius:3px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.8);animation:grow .5s var(--spring)}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.row.live{background:rgba(255,255,255,.15)}
.avatar{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.02em;
  background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.05));border:1px solid var(--line2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px -6px rgba(0,0,0,.7);transition:transform .4s var(--spring)}
.row:hover .avatar{transform:scale(1.07) rotate(-3deg)}
.avatar.lg{width:56px;height:56px;border-radius:18px;font-size:21px}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:550;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;font-size:11.5px;color:var(--fg3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .acts{display:flex;gap:2px;opacity:0;transition:opacity .2s}
.row:hover .acts{opacity:1}
.badge{flex:none;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.04em;background:var(--fill2);border:1px solid var(--line);color:var(--fg2)}
.badge.w{background:#fff;color:var(--ink);border-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--fg4);border-top-color:#fff;animation:spin .8s linear infinite;flex:none}

.empty{display:grid;place-items:center;text-align:center;padding:48px 28px;color:var(--fg2);align-content:center;height:100%}
.empty h3{font-size:19px;color:var(--fg);margin-bottom:8px;font-weight:600}
.empty p{max-width:340px;margin:0 auto 18px;font-size:13px;line-height:1.5}
.sk{height:62px;border-radius:16px;margin-bottom:4px;background:linear-gradient(90deg,var(--fill) 25%,var(--fill2) 50%,var(--fill) 75%);background-size:300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}

/* ── контролы ── */
.seg{position:relative;display:inline-flex;padding:4px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line);max-width:100%}
.seg button{position:relative;z-index:1;padding:7px 15px;border-radius:10px;font-size:12.5px;font-weight:550;color:var(--fg3);transition:color .3s;white-space:nowrap}
.seg button:hover{color:var(--fg2)}
.seg button.on{color:var(--ink)}
.seg button.na{opacity:.4}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:0;border-radius:10px;background:#fff;transition:transform .45s var(--spring),width .45s var(--spring);box-shadow:0 4px 14px -4px rgba(255,255,255,.35)}
.seg.full{display:flex}.seg.full button{flex:1;padding-left:6px;padding-right:6px}
.minibtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:12px;background:var(--fill2);border:1px solid var(--line);font-size:12.5px;font-weight:550;white-space:nowrap;transition:background .25s,transform .3s var(--spring),opacity .2s}
.minibtn svg{width:15px;height:15px}
.minibtn:hover{background:var(--fill3);transform:translateY(-1px)}
.minibtn:active{transform:scale(.96)}
.minibtn.solid{background:linear-gradient(180deg,#fff,#d9d9db);color:var(--ink);border-color:#fff}
.minibtn.solid:hover{background:#fff}
.minibtn:disabled{opacity:.45;pointer-events:none}
.minibtn.sm{padding:6px 13px;border-radius:10px;font-size:12px}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .65s ease-out forwards}
.solid .rip,.play .rip{background:rgba(0,0,0,.18)}
@keyframes rip{to{transform:scale(1);opacity:0}}
.inp{width:100%;height:42px;padding:0 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);user-select:text;transition:border-color .25s,background .25s}
.inp:focus{border-color:var(--line2);background:rgba(0,0,0,.4)}
.inp::placeholder{color:var(--fg3)}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.hint{font-size:12px;color:var(--fg3);line-height:1.5}
.hint.warn{color:var(--fg2)}

.dd{position:relative;display:inline-block}
.dd>button{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px 0 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);min-width:150px;max-width:100%;width:100%;transition:border-color .25s}
.dd>button:hover,.dd.open>button{border-color:var(--line2)}
.dd>button span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd>button svg{width:15px;height:15px;color:var(--fg3);transition:transform .35s var(--spring)}
.dd.open>button svg{transform:rotate(180deg)}
.dd .menu{position:absolute;left:0;top:calc(100% + 6px);min-width:100%;max-height:300px;overflow-y:auto;padding:6px;border-radius:16px;z-index:60;scrollbar-width:none;
  background:rgba(18,18,20,.97);border:1px solid var(--line2);box-shadow:0 24px 50px -10px rgba(0,0,0,.8);
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .2s,transform .3s var(--ease)}
.dd .menu::-webkit-scrollbar{display:none}
.dd.open .menu{opacity:1;transform:none;pointer-events:auto}
.dd.up .menu{top:auto;bottom:calc(100% + 6px)}
.dd .menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;padding:9px 12px;border-radius:10px;font-size:13px;text-align:left;white-space:nowrap;color:var(--fg2);transition:background .2s,color .2s}
.dd .menu button:hover{background:var(--fill2);color:var(--fg)}
.dd .menu button.on{color:var(--fg);background:var(--fill)}
.dd .menu small{color:var(--fg3);font-size:11px}

.switch{position:relative;width:44px;height:26px;border-radius:26px;flex:none;background:var(--fill2);border:1px solid var(--line);transition:background .3s var(--ease)}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--fg3);transition:transform .4s var(--spring),background .3s}
.switch.on{background:rgba(255,255,255,.28)}
.switch.on::after{transform:translateX(18px);background:#fff;box-shadow:0 0 10px rgba(255,255,255,.6)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px}
.opt .t b{display:block;font-weight:550;font-size:13.5px}
.opt .t small{display:block;color:var(--fg3);font-size:12px;margin-top:2px;line-height:1.4}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,#fff var(--p,50%),var(--fill2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px rgba(255,255,255,.14),0 4px 12px rgba(0,0,0,.6);cursor:pointer;transition:box-shadow .2s}
input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 0 7px rgba(255,255,255,.16),0 4px 12px rgba(0,0,0,.6)}

.bar{position:relative;flex:1;height:6px;border-radius:6px;background:var(--fill2);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.5),#fff);transition:width .35s var(--ease)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-100%);animation:sheen 1.6s linear infinite}
@keyframes sheen{to{transform:translateX(100%)}}
.bar.ind i{width:35%!important;animation:ind 1.3s var(--ease) infinite}
@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* ── главная ── */
.stage{position:relative;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.stage .art{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(520px 380px at 80% 8%,rgba(255,255,255,.1),transparent 70%),radial-gradient(420px 320px at 5% 100%,rgba(255,255,255,.06),transparent 70%)}
.stage .art svg{position:absolute;right:-70px;top:-50px;width:460px;height:460px;opacity:.12;stroke:none;animation:float 9s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0) rotate(0)}to{transform:translateY(22px) rotate(3deg)}}
.hero{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:30px 34px 20px}
.hero>*{animation:up .7s var(--ease) both}
.hero>.prog,.hero>.console{animation:none}
.hero>*:nth-child(2){animation-delay:.05s}.hero>*:nth-child(3){animation-delay:.1s}.hero>*:nth-child(4){animation-delay:.15s}.hero>*:nth-child(5){animation-delay:.2s}.hero>*:nth-child(6){animation-delay:.25s}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero .top{display:flex;align-items:center;gap:16px}
.hero h1{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.12;margin-top:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(180deg,#fff,rgba(255,255,255,.62));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:30px;background:rgba(0,0,0,.35);border:1px solid var(--line);font-size:12px;color:var(--fg2)}
.chip svg{width:13px;height:13px}
.playrow{display:flex;align-items:center;gap:14px;margin-top:30px;flex-wrap:wrap}
.play{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:12px;height:60px;min-width:230px;padding:0 34px;border-radius:30px;font-size:16px;font-weight:650;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff,#cfcfd2);color:var(--ink);border:1px solid #fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.3),0 0 46px -4px rgba(255,255,255,.35),0 18px 36px -10px rgba(0,0,0,.7);
  transition:transform .4s var(--spring),box-shadow .5s,background .4s,color .4s;animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 1px rgba(255,255,255,.4),0 0 70px 0 rgba(255,255,255,.5),0 18px 36px -10px rgba(0,0,0,.7)}}
.play svg{width:20px;height:20px;fill:currentColor;stroke:none}
.play:hover{transform:translateY(-2px) scale(1.03)}
.play:active{transform:scale(.96)}
.play.stop{background:rgba(255,255,255,.08);color:var(--fg);border-color:var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 18px 36px -10px rgba(0,0,0,.7);animation:none}
.play.wait{background:rgba(255,255,255,.1);color:var(--fg2);border-color:var(--line);box-shadow:none;pointer-events:none;animation:none}
.play.wait svg{display:none}
.prog{margin-top:22px;max-width:560px;opacity:0;transform:translateY(6px);transition:opacity .4s var(--ease),transform .5s var(--ease);pointer-events:none}
.prog.on{opacity:1;transform:none}
.prog .ph{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--fg2);margin-bottom:8px}
.prog .ph b{font-weight:600;color:var(--fg);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.prog .ph span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;color:var(--fg3)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:auto;padding-top:20px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:0}
.quick:empty{display:none}
.quick .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);align-self:center;margin-right:2px}
#pal input{width:100%}
.palrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--fg2)}
.palrow.on,.palrow:hover{background:var(--fill2);color:var(--fg)}
.palrow small{margin-left:auto;color:var(--fg3);font-size:11.5px}
.tile{position:relative;padding:13px 15px;border-radius:18px;background:rgba(0,0,0,.32);border:1px solid var(--line);text-align:left;transition:background .3s,transform .4s var(--ease),border-color .3s;min-width:0}
.tile:hover{background:rgba(0,0,0,.45);transform:translateY(-3px)}
button.tile:hover{border-color:var(--line2)}
.tile span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:22px}
.tile b{display:block;font-size:17px;font-weight:600;margin-top:4px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile svg{position:absolute;right:13px;top:13px;width:16px;height:16px;color:var(--fg3);transition:transform .4s var(--spring)}
.tile:hover svg{transform:scale(1.2) rotate(-6deg)}
.tiles .tile{padding:12px 11px}.tiles .tile b{font-size:15px}.tiles .tile span{padding-right:18px;letter-spacing:.05em;font-size:10px}.tiles .tile svg{right:10px;top:12px}
.console{position:relative;margin-top:12px;border-radius:18px;background:rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden;
  height:0;opacity:0;transition:height .5s var(--ease),opacity .3s}
.console.on{height:210px;opacity:1}
.console .ch{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);border-bottom:1px solid var(--line)}
.console pre{height:calc(100% - 46px);overflow:auto;padding:10px 16px;font:11.5px/1.5 var(--mono);color:var(--fg2);user-select:text;white-space:pre-wrap;word-break:break-all;scrollbar-width:thin;scrollbar-color:var(--fg4) transparent}

/* ── версии ── */
.vd{position:relative;flex:1;min-height:0;overflow-y:auto;padding:30px 34px;display:flex;flex-direction:column;gap:20px;scrollbar-width:none}
.vd::-webkit-scrollbar{display:none}
.vd>*{animation:up .6s var(--ease) both}
.vd>*:nth-child(2){animation-delay:.05s}.vd>*:nth-child(3){animation-delay:.1s}.vd>*:nth-child(4){animation-delay:.15s}.vd>*:nth-child(5){animation-delay:.2s}
.vd h1{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1.1;background:linear-gradient(180deg,#fff,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent}
.vd .sub{color:var(--fg3);font-size:13px;margin-top:8px}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid var(--line);font-size:12.5px;color:var(--fg2);line-height:1.5;max-width:600px}
.note svg{width:18px;height:18px;flex:none;color:var(--fg3);margin-top:1px}
.note code{font-family:var(--mono);font-size:11.5px;color:var(--fg);background:var(--fill2);padding:1px 6px;border-radius:6px;word-break:break-all}
.acts2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;max-width:640px}
.pre{position:relative;text-align:left;padding:13px 15px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid var(--line);transition:background .3s,border-color .3s,transform .4s var(--spring)}
.pre:hover{transform:translateY(-3px);background:rgba(255,255,255,.06)}
.pre.on{background:rgba(255,255,255,.14);border-color:#fff;box-shadow:0 0 28px -8px rgba(255,255,255,.45)}
.pre b{display:block;font-size:13.5px;font-weight:600}
.pre small{display:block;margin-top:5px;font-size:11.5px;line-height:1.4;color:var(--fg3)}
.pre.on small{color:var(--fg2)}

/* ── аккаунты ── */
.ms{display:flex;flex-direction:column;gap:14px;max-width:520px}
.code{font-family:var(--mono);font-size:38px;font-weight:600;letter-spacing:.18em;padding:18px 24px;border-radius:20px;background:rgba(0,0,0,.4);border:1px solid var(--line2);text-align:center;user-select:text;animation:pop .6s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.wait{display:flex;align-items:center;gap:10px;color:var(--fg2);font-size:13px}

/* ── моды ── */
.sheet{display:flex;flex-direction:column;min-height:0;overflow:hidden}
#srvpage,#newspage{display:block;overflow-y:auto;padding:14px 14px 20px;scrollbar-width:none}
#srvpage::-webkit-scrollbar,#newspage::-webkit-scrollbar{display:none}
#srvpage .updbar,#newspage .updbar{flex-wrap:wrap;gap:10px}
#srvpage .updbar>span:first-child,#newspage .updbar>span:first-child{flex:1 1 260px;min-width:0}
#srvpage .updbar>span:last-child{flex-wrap:wrap}
.mhead{display:flex;flex-direction:column;gap:12px;padding:18px 20px 12px}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mrow .grow{flex:1}
.mrow .search{flex:1;min-width:200px}
.mbody{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 18px;scrollbar-width:none}
.mbody::-webkit-scrollbar{display:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:10px}
.card{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:rgba(0,0,0,.26);border:1px solid var(--line);
  transition:background .3s,border-color .3s,transform .4s var(--ease);animation:rin .5s var(--ease) both;animation-delay:calc(var(--i,0)*14ms);min-width:0}
.card:hover{background:rgba(255,255,255,.06);border-color:var(--line2);transform:translateY(-2px)}
.card.off{opacity:.5}
.ico{width:52px;height:52px;border-radius:15px;flex:none;object-fit:cover;background:var(--fill2) center/cover;border:1px solid var(--line);display:grid;place-items:center;color:var(--fg3);font-weight:700;overflow:hidden}
.card .meta small{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.card .meta .by{color:var(--fg3);font-size:11px;margin-top:3px;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
.more{display:flex;justify-content:center;padding:18px 0 4px}
.cnt{color:var(--fg3);font-size:12px}
#drop{position:absolute;inset:10px;z-index:40;display:grid;place-items:center;border-radius:22px;border:2px dashed rgba(255,255,255,.5);background:rgba(8,8,10,.86);backdrop-filter:blur(8px);
  font-size:18px;font-weight:600;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;pointer-events:none;text-align:center;line-height:1.6}
#drop.on{opacity:1;visibility:visible}
#drop small{display:block;font-size:13px;font-weight:400;color:var(--fg2)}
#drop svg{width:44px;height:44px;margin:0 auto 12px;animation:float 1.6s ease-in-out infinite alternate}

/* ── настройки ── */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 6px 20px}
.panel{padding:22px 24px;display:flex;flex-direction:column;gap:16px;border-radius:24px;animation:up .6s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
.panel h3{font-size:15px;font-weight:600}
.panel h3 small{display:block;font-weight:400;color:var(--fg3);font-size:12px;margin-top:3px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:30px;font-weight:650;letter-spacing:-.03em}
.big small{font-size:14px;color:var(--fg3);margin-left:4px;font-weight:500}

/* ── модалка и тосты ── */
#modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
#modal.on{opacity:1;pointer-events:auto}
#modal .box{width:min(480px,90vw);padding:26px;border-radius:26px;transform:translateY(14px) scale(.97);transition:transform .5s var(--spring)}
#modal.on .box{transform:none}
#modal h3{font-size:20px;font-weight:650;margin-bottom:10px;letter-spacing:-.02em}
#modal .txt{color:var(--fg2);font-size:13.5px;line-height:1.55;max-height:260px;overflow:auto;white-space:pre-wrap;user-select:text;word-break:break-word}
#modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
#toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:120;pointer-events:none}
.toast{padding:12px 18px;border-radius:16px;font-size:13px;background:rgba(20,20,22,.96);border:1px solid var(--line2);box-shadow:0 20px 40px -10px rgba(0,0,0,.8);
  animation:tin .5s var(--spring) both;max-width:380px}
.toast.out{animation:tout .35s var(--ease) both}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(20px)}}

/* ── головы и аватары-скины ── */
.head{display:block;width:100%;height:100%;image-rendering:pixelated;border-radius:inherit;object-fit:cover}
.avatar.skin{padding:0;overflow:hidden;background:#17171a}
.racc{padding:0;overflow:hidden}
.racc>.head{border-radius:13px}
.addrow{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;width:calc(100% - 8px);margin:10px 4px 0;border-radius:16px;border:1px dashed var(--line2);color:var(--fg2);font-weight:550;transition:background .25s,color .25s,transform .35s var(--spring),border-color .25s}
.addrow svg{width:16px;height:16px}
.addrow:hover{background:var(--fill);color:var(--fg);transform:translateY(-2px);border-color:rgba(255,255,255,.4)}
.gh{font-weight:700;letter-spacing:-.035em;line-height:1.1;background:linear-gradient(180deg,#fff,rgba(255,255,255,.58));-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-all}

/* ── страница аккаунта ── */
.adetail{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(150px,28%,330px);overflow:hidden}
.ainfo .gh{font-size:clamp(26px,3vw,42px)!important;word-break:break-word}
.ainfo .minibtn{white-space:normal;text-align:left}
.ainfo{position:relative;z-index:2;overflow-y:auto;padding:24px 6px 20px 24px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.ainfo::-webkit-scrollbar{display:none}
.ainfo>*{animation:up .6s var(--ease) both}
.ainfo>*:nth-child(2){animation-delay:.05s}.ainfo>*:nth-child(3){animation-delay:.1s}.ainfo>*:nth-child(4){animation-delay:.15s}.ainfo>*:nth-child(5){animation-delay:.2s}.ainfo>*:nth-child(6){animation-delay:.25s}
.aview{position:relative;display:grid;place-items:center;min-height:0}
.aview::before{content:"";position:absolute;inset:6% -10% 6% 0;background:radial-gradient(closest-side,rgba(255,255,255,.16),transparent 72%);pointer-events:none}
.mc-stage{perspective:1200px;width:100%;height:100%;display:grid;place-items:center;cursor:grab;touch-action:none}
.mc-stage:active{cursor:grabbing}
.mc-rig{position:relative;width:0;height:0;transform-style:preserve-3d}
.mc-rig *{transform-style:preserve-3d}
.mc-abs{position:absolute;left:0;top:0}
.mc-f{position:absolute;left:50%;top:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;image-rendering:pixelated;background-repeat:no-repeat}
@keyframes swA{0%,100%{transform:rotateX(26deg)}50%{transform:rotateX(-26deg)}}
@keyframes swB{0%,100%{transform:rotateX(-26deg)}50%{transform:rotateX(26deg)}}
@keyframes nod{0%,100%{transform:rotateX(0)}50%{transform:rotateX(5deg)}}
.sw-a{animation:swA 1.3s ease-in-out infinite;transform-origin:0 0}
.sw-b{animation:swB 1.3s ease-in-out infinite;transform-origin:0 0}
.sw-n{animation:nod 2.6s ease-in-out infinite;transform-origin:0 0}
.emoting .sw-a,.emoting .sw-b,.emoting .sw-n{animation:none!important}
.emlay{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:14px;min-height:0;height:100%}
.emlist{display:flex;flex-direction:column;gap:8px;min-height:0}
.emrows{overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:4px;min-height:0;flex:1}
.emrows::-webkit-scrollbar{display:none}
.erow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;cursor:pointer;color:var(--fg2);border:1px solid transparent}
.erow:hover{background:var(--fill)}.erow.on{background:var(--fill2);color:var(--fg);border-color:var(--line2)}
.erow b{font-weight:600;color:var(--fg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow small{color:var(--fg3);font-size:11.5px;white-space:nowrap}
.erow .star{color:var(--fg3);font-size:15px;line-height:1}.erow .star.on{color:#fff}
.egrp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:10px 12px 4px}
.empv{display:flex;flex-direction:column;gap:10px;min-height:0;padding:14px;border-radius:20px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.empv .view{flex:1;min-height:220px;position:relative;border-radius:14px;overflow:hidden}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.fchip{padding:5px 12px;border-radius:16px;font-size:12px;border:1px solid var(--line);color:var(--fg2);cursor:pointer;background:transparent}
.fchip.on{background:var(--fg);color:#000;border-color:var(--fg)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini .tile b{font-size:15px}
.hist{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hthumb{position:relative;flex:none;width:68px;height:116px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;transition:transform .35s var(--spring),border-color .25s,box-shadow .3s}
.hthumb:hover{transform:translateY(-4px);border-color:var(--line2)}
.hthumb.cur{border-color:#fff;box-shadow:0 0 24px -6px rgba(255,255,255,.55)}
.hthumb canvas{width:44px;height:88px;image-rendering:pixelated}
.hthumb .x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#1b1b1f;border:1px solid var(--line2);opacity:0;transform:scale(.7);transition:opacity .2s,transform .3s var(--spring)}
.hthumb:hover .x{opacity:1;transform:none}
.hthumb .x svg{width:12px;height:12px}
.kv{display:flex;flex-direction:column;gap:6px}
.kvr{display:flex;justify-content:space-between;gap:14px;padding:9px 13px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:12.5px}
.kvr b{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kvr span{color:var(--fg3);white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:9px}
.sec>.lbl{display:flex;justify-content:space-between;align-items:center}

/* ── окошко добавления аккаунта ── */
#xmodal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:110;opacity:0;pointer-events:none;transition:opacity .3s}
#xmodal.on{opacity:1;pointer-events:auto}
#xbox{width:min(460px,92vw);padding:26px;border-radius:26px;transform:translateY(14px) scale(.97);transition:transform .5s var(--spring)}
#xmodal.on #xbox{transform:none}
#xbox h3{font-size:20px;font-weight:650;margin-bottom:14px;letter-spacing:-.02em}
#xbox .field{margin-bottom:12px}
#xbox .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.err{color:#fff;font-size:12.5px;padding:10px 13px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line2);margin-top:4px}

/* ── карточка мода ── */
.drawer{position:absolute;top:10px;right:10px;bottom:10px;width:min(640px,94%);z-index:35;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,0)),#101012;
  transform:translateX(40px) scale(.98);opacity:0;pointer-events:none;transition:transform .55s var(--spring),opacity .3s;box-shadow:0 30px 80px -10px rgba(0,0,0,.9)}
.drawer.on{transform:none;opacity:1;pointer-events:auto}
.dh{display:flex;align-items:center;gap:14px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.dh .meta b{font-size:18px;font-weight:650;letter-spacing:-.01em}
.dbody{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 22px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.dbody::-webkit-scrollbar{display:none}
.gal{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{height:150px;border-radius:14px;border:1px solid var(--line);flex:none}
.md{font-size:13.5px;line-height:1.6;color:var(--fg2);user-select:text}
.md h1,.md h2,.md h3,.md h4{color:var(--fg);margin:14px 0 6px;font-weight:650;letter-spacing:-.01em}
.md h1{font-size:19px}.md h2{font-size:17px}.md h3{font-size:15px}.md h4{font-size:14px}
.md p{margin:6px 0}.md ul,.md ol{margin:6px 0 6px 20px}
.md img{max-width:100%;border-radius:12px;margin:6px 0;display:block}
.md code{font-family:var(--mono);font-size:12px;background:var(--fill2);padding:1px 6px;border-radius:6px}
.md pre{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.4);border:1px solid var(--line);padding:12px;border-radius:12px;overflow-x:auto;white-space:pre}
.md a{color:#fff;text-decoration:underline;text-decoration-color:var(--fg3);cursor:pointer}
.elsewhere{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:20px;background:var(--fill2);border:1px solid var(--line);font-size:10.5px;color:var(--fg2);white-space:nowrap}
.card{cursor:pointer}

let _errShown = 0;

const S = {

/* ── утилиты ── */
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#toasts').append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 3800);
}
function modal(title, text, buttons){
  return new Promise(res => {
    $('#mt').textContent = title; $('#mx').textContent = text || ''; $('#mx').style.display = text ? '' : 'none';
    const mb = $('#mb'); mb.innerHTML = '';
    for (const b of buttons || [{label:'Понятно', val:true, cls:'solid'}]) {
      const el = document.createElement('button'); el.className = 'minibtn ' + (b.cls || ''); el.textContent = b.label;
      el.onclick = () => { $('#modal').classList.remove('on'); res(b.val); }; mb.append(el);
    }
    $('#modal').classList.add('on');
  });
}
function modalHtml(title, html, buttons){
  return new Promise(res => {
    $('#mt').textContent = title; $('#mx').innerHTML = html; $('#mx').style.display = '';
    const mb = $('#mb'); mb.innerHTML = '';
    for (const b of buttons || [{label:'Понятно', val:true, cls:'solid'}]) {
      const el = document.createElement('button'); el.className = 'minibtn ' + (b.cls || ''); el.textContent = b.label;

}
const closeX = () => $('#xmodal').classList.remove('on');
addEventListener('keydown', e => { if (e.key === 'Escape') { $('#modal').classList.remove('on'); closeX(); } });
$('#xmodal').addEventListener('mousedown', e => { if (e.target.id === 'xmodal') closeX(); });
function fmtNum(n){ n = +n || 0; if (n >= 1e9) return (n/1e9).toFixed(1)+' млрд'; if (n >= 1e6) return (n/1e6).toFixed(1)+' млн'; if (n >= 1e3) return Math.round(n/1e3)+' тыс.'; return String(n); }
function fmtSize(b){ if (b >= 1048576) return (b/1048576).toFixed(1)+' МБ'; if (b >= 1024) return Math.round(b/1024)+' КБ'; return b+' Б'; }
function plural(n, a, b, c){ const m = n % 100, d = n % 10; return (m > 10 && m < 20) ? c : d === 1 ? a : (d >= 2 && d <= 4) ? b : c; }
function ago(ts){
  if (!ts) return 'ещё не играл';
  const d = Math.floor((Date.now()/1000 - ts) / 86400);
  if (d <= 0) return 'сегодня'; if (d === 1) return 'вчера'; if (d < 30) return d + ' ' + plural(d, 'день','дня','дней') + ' назад';

}

/* волна под курсором на кнопках */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('.minibtn,.play'); if (!b || b.disabled) return;

  el.firstElementChild.onclick = e => { e.stopPropagation(); const o = el.classList.contains('open'); $$('.dd.open').forEach(d => d.classList.remove('open')); if (!o) el.classList.add('open'); };

/* ── главная ── */
function renderProfiles(){
  const el = $('#plist');
  if (!S.profiles.length) {
    el.innerHTML = `<div class="empty"><div><h3>Профилей пока нет</h3><p>Выбери версию Minecraft и загрузчик. У каждого профиля будет своя папка с модами, мирами и настройками.</p><button class="minibtn solid" id="emptyAdd">${I.plus} Добавить версию</button></div></div>`;
    $('#emptyAdd').onclick = () => go('versions'); return;
  }
  const sorted = [...S.profiles].sort((a, b) => (b.last_played || 0) - (a.last_played || 0) || b.created - a.created);
  el.innerHTML = sorted.map((p, i) => {
    const live = S.game.id === p.id && S.game.state === 'running';
    return `<div class="row ${p.id === S.sel ? 'sel' : ''} ${live ? 'live' : ''}" data-id="${esc(p.id)}" style="--i:${i}">
      <div class="avatar">${esc(letter(LNAME[p.loader] || 'V'))}</div>
      <div class="meta"><b>${esc(p.name)}</b><small>${esc(sub(p))}${p.mods ? ' · ' + p.mods + ' ' + plural(p.mods, 'мод','мода','модов') : ''}</small></div>
      ${live ? '<span class="badge w">ИГРАЕТ</span>' : !p.installed ? '<span class="badge">НЕ СКАЧАНО</span>' : ''}
      <div class="acts"><button class="ibtn sm" data-act="dup" title="Создать копию">${I.copy}</button><button class="ibtn sm" data-act="del" title="Удалить">${I.trash}</button></div></div>`;
  }).join('');
  $$('.row', el).forEach(r => r.onclick = e => {
    const id = r.dataset.id;
    if (e.target.closest('[data-act=dup]')) return invoke('duplicate_profile', {id}).then(async p => { toast(`Копия «${p.name}» создана`); await loadProfiles(); }).catch(x => modal('Не удалось', String(x)));
    if (e.target.closest('[data-act=del]')) return delProfile(id);
    S.sel = id; renderProfiles(); renderHero();
  });
}
async function delProfile(id){
  const p = prof(id); if (!p) return;
  if (S.game.id === id && S.game.state !== 'idle') return toast('Сначала останови игру');
  const r = await modal(`Удалить «${p.name}»?`, `Можно убрать только профиль из списка, а можно вместе с его папкой: моды, миры и настройки этого профиля удалятся безвозвратно.`, [
    {label:'Отмена', val:null}, {label:'Только профиль', val:'keep'}, {label:'Вместе с папкой', val:'all', cls:'solid'}]);
  if (!r) return;
  try { await invoke('delete_profile', {id, removeFiles: r === 'all'}); toast('Профиль удалён'); if (S.sel === id) S.sel = null; await loadProfiles(); } catch (e) { toast(e); }
}
async function loadProfiles(){
  S.profiles = await invoke('profiles');
  if (!prof(S.sel)) {
    const last = [...S.profiles].sort((a, b) => (b.last_played || 0) - (a.last_played || 0))[0];
    S.sel = last ? last.id : null;
  }
  renderProfiles(); renderHero();
  if (S.page === 'mods') renderModsHead();
}
function renderHero(){
  const el = $('#hero'); const p = cur();
  if (!p) { el.innerHTML = ART + `<div class="empty"><div><h3>Добро пожаловать в Noxel</h3><p>Добавь первую версию игры, и она появится здесь. Дальше достаточно одной кнопки «Играть».</p><button class="minibtn solid" id="heroAdd">${I.plus} Добавить версию</button></div></div>`; $('#heroAdd').onclick = () => go('versions'); return; }
  const mine = S.game.id === p.id, st = mine ? S.game.state : 'idle', other = !mine && S.game.state !== 'idle';
  const btn = st === 'running' ? `<button class="play stop" id="playBtn">${I.stop} Остановить</button>`
    : st === 'installing' ? `<button class="play wait" id="playBtn">Подготовка…</button>`
    : other ? `<button class="play wait" id="playBtn">Занято другим профилем</button>`
    : `<button class="play" id="playBtn">${I.play} ${p.installed ? 'Играть' : 'Скачать и играть'}</button>`;
  const a = active();
  const pr = S.presets.find(x => x.id === p.preset);
  el.innerHTML = ART + `<div class="hero">
    <div class="top"><div class="avatar lg">${esc(letter(LNAME[p.loader] || 'V'))}</div><div class="chips"><span class="chip">${esc(p.mc)}</span><span class="chip">${esc(LNAME[p.loader] || p.loader)}${p.loader_ver ? ' ' + esc(p.loader_ver) : ''}</span>${pr ? `<span class="chip">${esc(pr.name)}</span>` : ''}${p.installed ? '' : '<span class="chip">не скачано</span>'}<span class="chip">${esc(ago(p.last_played))}</span></div></div>
    <h1>${esc(p.name)}</h1>
    <div class="playrow">${btn}</div>
    <div class="prog" id="prog"><div class="ph"><b id="pstage"></b><span id="pdetail"></span></div><div class="bar" id="pbar"><i style="width:0"></i></div></div>
    <div class="quick" id="quick"></div>
    <div class="tiles">
      <button class="tile" id="tWorlds"><span>Миры</span><b>Копии</b>${I.folder}</button>
      <button class="tile" id="tMods"><span>Моды</span><b><em data-n="${p.mods}" style="font-style:normal">0</em> ${plural(p.mods, 'мод','мода','модов')}</b>${I.mod}</button>
      <button class="tile" id="tDir"><span>Папка</span><b>Открыть</b>${I.folder}</button>
      <button class="tile" id="tLog"><span>Консоль</span><b>${S.logOpen ? 'Скрыть' : 'Показать'}</b>${I.term}</button>
      <button class="tile" id="tAcc"><span>Аккаунт</span><b>${esc(a ? a.name : '—')}</b>${I.user}</button>
    </div>
    <div class="console ${S.logOpen ? 'on' : ''}" id="console"><div class="ch"><span>Лог игры</span><span><button class="minibtn sm" id="logWhy" style="margin-right:6px">Разобрать ошибку</button><button class="ibtn sm" id="logCopy" title="Копировать">${I.copy}</button></span></div><pre id="logpre"></pre></div>
  </div>`;
  $$('[data-n]', el).forEach(n => countUp(n, +n.dataset.n));
  $('#playBtn').onclick = () => playClick(p);
  $('#tMods').onclick = () => { S.m.profile = p.id; go('mods'); };
  $('#tWorlds').onclick = () => worldsModal(p);
  quickServers(p);
  $('#tDir').onclick = () => invoke('open_folder', {profileId: p.id, sub: null}).catch(toast);
  $('#tAcc').onclick = () => go('accounts');
  $('#tLog').onclick = () => { S.logOpen = !S.logOpen; $('#console').classList.toggle('on', S.logOpen); $('#tLog b').textContent = S.logOpen ? 'Скрыть' : 'Показать'; if (S.logOpen) fillLog(); };
  $('#logWhy').onclick = () => crashHelp(false, 0);
  $('#logCopy').onclick = () => { navigator.clipboard.writeText($('#logpre').textContent).then(() => toast('Лог скопирован')).catch(() => {}); };
  if (S.logOpen) fillLog();
  setProgress();
}
/* быстрый заход на недавние серверы прямо с главной */
async function quickServers(p){
  try {
    if (!S.av || !p.installed) return;
    const d = await invoke('account_details', {id: S.av, refresh: false}), el = $('#quick'); if (!el) return;
    const list = ((d.stats || {}).servers || []).filter(x => x.host).sort((a, b) => (b.last || 0) - (a.last || 0)).slice(0, 3);
    if (!list.length) return;
    el.innerHTML = '<span class="lab">Зайти на</span>' + list.map(x => `<button class="minibtn sm" data-qj="${esc(x.host)}">${I.play} ${esc(x.host)}</button>`).join('');
    $$('[data-qj]', el).forEach(b => b.onclick = async () => { b.disabled = true; try { await invoke('launch_to', {id: p.id, host: b.dataset.qj}); } catch (e) { b.disabled = false; modal('Не удалось запустить', String(e)); } });
  } catch (e) {}
}

/* миры профиля и резервные копии */
const fmtDate = t => t ? new Date(t * 1000).toLocaleString('ru-RU', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '—';
async function worldsModal(p){
  const box = $('#xbox'); box.innerHTML = '<h3>Миры</h3><div class="hint">Загружаю…</div>'; $('#xmodal').classList.add('on');
  const render = async () => {
    let r, cloud = null, na = noxAcc(), dv = null;
    if (S.set && S.set.dav_url) { try { dv = {list: await invoke('dav_list', {profileId: p.id})}; } catch (e) { dv = {error: String(e), list: []}; } }
    if (na) { try { cloud = await invoke('cloud_list', {id: na.id}); } catch (e) { cloud = {error: String(e), worlds: [], used: 0, quota: 0}; } }
    try { r = await invoke('worlds_list', {profileId: p.id}); } catch (e) { box.innerHTML = `<h3>Миры</h3><div class="hint">${esc(e)}</div><div class="btns"><button class="minibtn solid" id="xc">Закрыть</button></div>`; $('#xc').onclick = closeX; return; }
    box.innerHTML = `<h3>Миры профиля «${esc(p.name)}»</h3>
      <div class="hint" style="margin-bottom:10px">Резервная копия — это zip-архив мира. При восстановлении текущий мир не удаляется, а переименовывается рядом.</div>
      <div style="max-height:360px;overflow:auto;scrollbar-width:none">
      ${r.worlds.length ? r.worlds.map((w, i) => `<div class="palrow" style="cursor:default"><b style="color:var(--fg)">${esc(w.name)}</b><small>${fmtSize(w.size)} · играл ${fmtDate(w.modified)} · копий: ${w.backups}</small><button class="minibtn sm" data-wb="${i}">Сделать копию</button><button class="minibtn sm" data-wc="${i}" title="Сохранить мир на сервере Noxel, чтобы открыть его на другом компьютере">В облако</button>${dv ? `<button class="minibtn sm" data-dw="${i}" title="Загрузить в твоё облако (WebDAV)">В моё облако</button>` : ''}</div>`).join('') : '<div class="hint" style="padding:10px">В этом профиле пока нет миров.</div>'}
      ${r.backups.length ? `<div class="lbl" style="margin:14px 0 6px"><span>Копии</span></div>` + r.backups.map((b, i) => `<div class="palrow" style="cursor:default"><span style="color:var(--fg)">${esc(b.world)}</span><small>${fmtDate(b.created)} · ${fmtSize(b.size)}</small><button class="minibtn sm" data-br="${i}">Восстановить</button><button class="ibtn sm" data-bd="${i}" title="Удалить копию">${I.trash}</button></div>`).join('') : ''}
      ${dv ? `<div class="lbl" style="margin:14px 0 6px"><span>Моё облако (WebDAV)</span></div>` + (dv.error ? `<div class="hint" style="padding:6px 10px">${esc(dv.error)}</div>` : dv.list.length ? dv.list.map((c, i) => `<div class="palrow" style="cursor:default"><span style="color:var(--fg)">${esc(c.name)}</span><small>${fmtSize(c.size)}</small><button class="minibtn sm" data-dd="${i}">Скачать сюда</button></div>`).join('') : '<div class="hint" style="padding:6px 10px">В твоём облаке для этого профиля пока пусто.</div>') + `<div class="mrow" style="margin:8px 0 0"><button class="minibtn sm" id="dvSync">Синхронизировать изменённые</button></div>` : ''}
      ${na ? `<div class="lbl" style="margin:14px 0 6px"><span>Облако Noxel · один мир, до ${cloud && cloud.quota ? fmtSize(cloud.quota) : '300 МБ'}, сжимается при загрузке</span></div>` + (cloud && cloud.error ? `<div class="hint" style="padding:6px 10px">${esc(cloud.error)}</div>` : cloud && cloud.worlds.length ? cloud.worlds.map((c, i) => `<div class="palrow" style="cursor:default"><span style="color:var(--fg)">${esc(c.name)}</span><small>${esc(c.mc || '')} · ${fmtDate(c.created)} · ${fmtSize(c.size)}</small><button class="minibtn sm" data-cl="${i}" title="Ссылка, по которой друг скачает этот мир и увидит страницу с установкой Noxel">${c.share ? 'Скопировать ссылку' : 'Поделиться'}</button>${c.share ? `<button class="ibtn sm" data-cu="${i}" title="Отозвать ссылку">${I.ext}</button>` : ''}<button class="minibtn sm" data-cd="${i}">Скачать сюда</button><button class="ibtn sm" data-cx="${i}" title="Удалить из облака">${I.trash}</button></div>`).join('') : '<div class="hint" style="padding:6px 10px">В облаке пока пусто: нажми «В облако» у любого мира. Новый мир заменяет прежний.</div>') + `<div style="display:flex;gap:8px;margin-top:10px"><input class="inp" id="lnkIn" placeholder="Ссылка на мир друга: https://mr1s.site/w/…" style="flex:1" spellcheck="false"><button class="minibtn" id="lnkGo">Добавить по ссылке</button></div>` : '<div class="hint" style="margin-top:12px">Облачные миры доступны с аккаунтом Noxel (страница «Аккаунты»). Мир друга по ссылке можно добавить и без него.</div><div style="display:flex;gap:8px;margin-top:10px"><input class="inp" id="lnkIn" placeholder="Ссылка на мир друга: https://mr1s.site/w/…" style="flex:1" spellcheck="false"><button class="minibtn" id="lnkGo">Добавить по ссылке</button></div>'}
      </div><div class="btns"><button class="minibtn solid" id="xc">Готово</button></div>`;
    $('#xc').onclick = closeX;
    $$('[data-wc]', box).forEach(b => b.onclick = async () => { if (!na) return toast('Нужен аккаунт Noxel'); b.disabled = true; b.textContent = 'Загружаю…'; try { await invoke('cloud_upload', {id: na.id, profileId: p.id, world: r.worlds[+b.dataset.wc].name}); toast('Мир сохранён в облаке'); } catch (e) { modal('Не получилось', String(e)); } render(); });
    $$('[data-cd]', box).forEach(b => b.onclick = async () => { const c = cloud.worlds[+b.dataset.cd]; b.disabled = true; b.textContent = 'Скачиваю…'; try { await invoke('cloud_download', {id: na.id, profileId: p.id, cloudId: c.id, world: c.name}); toast(`Мир «${c.name}» скачан в профиль`); } catch (e) { modal('Не получилось', String(e)); } render(); });
    $$('[data-dw]', box).forEach(b => b.onclick = async () => { b.disabled = true; b.textContent = 'Загружаю…'; try { await invoke('dav_upload', {profileId: p.id, world: r.worlds[+b.dataset.dw].name}); toast('Мир в твоём облаке'); } catch (e) { modal('Не получилось', String(e)); } render(); });
    $$('[data-dd]', box).forEach(b => b.onclick = async () => { const c = dv.list[+b.dataset.dd]; b.disabled = true; b.textContent = 'Скачиваю…'; try { await invoke('dav_download', {profileId: p.id, world: c.name}); toast(`Мир «${c.name}» скачан в профиль`); } catch (e) { modal('Не получилось', String(e)); } render(); });
    if ($('#dvSync')) $('#dvSync').onclick = async () => { const b = $('#dvSync'); b.disabled = true; b.textContent = 'Синхронизирую…'; try { const n = await invoke('dav_sync', {profileId: p.id}); toast(n ? `Загружено миров: ${n}` : 'Всё уже синхронизировано'); } catch (e) { modal('Не получилось', String(e)); } render(); };
    $$('[data-cl]', box).forEach(b => b.onclick = async () => { const c = cloud.worlds[+b.dataset.cl]; try { const url = c.share || (await invoke('cloud_share', {id: na.id, cloudId: c.id})).url; await navigator.clipboard.writeText(url); toast('Ссылка скопирована: отправь её другу'); } catch (e) { modal('Не получилось', String(e)); } render(); });
    $$('[data-cu]', box).forEach(b => b.onclick = async () => { const c = cloud.worlds[+b.dataset.cu]; try { await invoke('cloud_unshare', {id: na.id, cloudId: c.id}); toast('Ссылка отозвана: по ней больше не скачать'); } catch (e) { modal('Не получилось', String(e)); } render(); });
    if ($('#lnkGo')) $('#lnkGo').onclick = async () => {
      const link = $('#lnkIn').value.trim(); if (!link) return;
      try {
        const info = await invoke('share_info', {link});
        const ok = await modal(`Добавить мир «${info.name}»?`, `${info.owner} поделился с тобой миром: Minecraft ${info.mc || '?'}, ${fmtSize(info.size)}. Он скачается в профиль «${p.name}». Если мир с таким именем уже есть, он сохранится рядом с суффиксом «-до-восстановления».`, [{label:'Отмена', val:false}, {label:'Скачать', val:true, cls:'solid'}]);
        if (!ok) return; $('#lnkGo').disabled = true; $('#lnkGo').textContent = 'Скачиваю…';
        await invoke('share_import', {profileId: p.id, link, name: info.name}); toast(`Мир «${info.name}» добавлен в профиль`);
      } catch (e) { modal('Не получилось', String(e)); }
      render();
    };
    $$('[data-cx]', box).forEach(b => b.onclick = async () => { const c = cloud.worlds[+b.dataset.cx]; const ok = await modal(`Удалить «${c.name}» из облака?`, 'Копия на сервере пропадёт.', [{label:'Отмена', val:false}, {label:'Удалить', val:true, cls:'solid'}]); if (!ok) return; try { await invoke('cloud_delete', {id: na.id, cloudId: c.id}); } catch (e) { toast(e); } render(); });
    $$('[data-wb]', box).forEach(b => b.onclick = async () => { b.disabled = true; b.textContent = 'Копирую…'; try { await invoke('world_backup', {profileId: p.id, world: r.worlds[+b.dataset.wb].name}); toast('Копия готова'); } catch (e) { modal('Не получилось', String(e)); } render(); });
    $$('[data-br]', box).forEach(b => b.onclick = async () => { const f = r.backups[+b.dataset.br]; const ok = await modal(`Восстановить «${f.world}»?`, 'Текущий мир будет переименован рядом с суффиксом «-до-восстановления», ничего не потеряется.', [{label:'Отмена', val:false}, {label:'Восстановить', val:true, cls:'solid'}]); if (!ok) return; try { await invoke('backup_restore', {profileId: p.id, file: f.file}); toast('Мир восстановлен'); } catch (e) { modal('Не получилось', String(e)); } worldsModal(p); });
    $$('[data-bd]', box).forEach(b => b.onclick = async () => { try { await invoke('backup_delete', {profileId: p.id, file: r.backups[+b.dataset.bd].file}); } catch (e) { toast(e); } render(); });
  };
  render();
}

/* поиск и быстрые действия: Ctrl+K */
function openPalette(){
  const box = $('#xbox');
  const items = [
    ...PAGES.map(([id, t]) => ({t: 'Перейти: ' + t, hint: 'раздел', run: () => go(id)})),
    ...S.profiles.map(p => ({t: 'Играть: ' + p.name, hint: `${p.mc} · ${LNAME[p.loader] || p.loader}`, run: () => { S.sel = p.id; go('home'); setTimeout(() => playClick(p), 150); }})),
    {t: 'Проверить обновления лаунчера', hint: 'обновление', run: () => checkLauncher(false)},
    {t: 'Открыть папку выбранного профиля', hint: 'профиль', run: () => invoke('open_folder', {profileId: S.sel, sub: null}).catch(toast)},
  ];
  box.innerHTML = `<div id="pal"><input class="inp" id="palQ" placeholder="Что сделать? Например: серверы, сборки, играть…" spellcheck="false"><div id="palL" style="margin-top:8px;max-height:340px;overflow:auto;scrollbar-width:none"></div></div>`;
  let sel = 0, shown = items;
  const draw = () => { $('#palL').innerHTML = shown.map((x, i) => `<div class="palrow ${i === sel ? 'on' : ''}" data-pi="${i}"><span>${esc(x.t)}</span><small>${esc(x.hint)}</small></div>`).join('') || '<div class="hint" style="padding:10px">Ничего не нашлось</div>'; $$('[data-pi]', box).forEach(r => r.onclick = () => run(+r.dataset.pi)); };
  const run = i => { const x = shown[i]; if (!x) return; closeX(); x.run(); };
  $('#palQ').oninput = e => { const q = e.target.value.toLowerCase().trim(); shown = items.filter(x => !q || (x.t + ' ' + x.hint).toLowerCase().includes(q)); sel = 0; draw(); };
  $('#palQ').onkeydown = e => { if (e.key === 'ArrowDown') { sel = Math.min(shown.length - 1, sel + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter') run(sel); };
  draw(); $('#xmodal').classList.add('on'); setTimeout(() => $('#palQ').focus(), 30);
}
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); } });

async function fillLog(){ const pre = $('#logpre'); if (!pre) return; const l = await invoke('get_logs'); pre.textContent = l.join('\n'); pre.scrollTop = pre.scrollHeight; }
function setProgress(){
  const pr = $('#prog'); if (!pr) return; const t = S.task; const p = cur();
  const on = t && p && t.id === p.id && S.game.state === 'installing';
  pr.classList.toggle('on', !!on); if (!on) return;
  $('#pstage').textContent = t.stage; $('#pdetail').textContent = t.detail || '';
  const bar = $('#pbar'); bar.classList.toggle('ind', t.frac < 0); $('i', bar).style.width = Math.max(0, Math.min(1, t.frac)) * 100 + '%';
}
async function playClick(p){
  if (S.game.id === p.id && S.game.state === 'running') return invoke('stop_game');
  if (S.set.show_console) { S.logOpen = true; }
  S.game = {id: p.id, state: 'installing'}; S.task = {id: p.id, stage: 'Подготовка', frac: -1, detail: ''}; renderHero(); renderProfiles(); setDot();
  try { await invoke('launch', {id: p.id}); } catch (e) { S.game = {state: 'idle', id: null}; renderHero(); renderProfiles(); setDot(); modal('Не удалось запустить', String(e)); }
}
function setDot(){ const d = $('#dot'); d.className = S.game.state === 'running' ? 'on' : S.game.state === 'installing' ? 'busy' : ''; }

/* ── версии ── */
async function loadVersions(force){
  if (S.versions && !force) { renderVersions(); renderVDetail(); return; }
  $('#vlist').innerHTML = '<div class="sk"></div>'.repeat(9);
  $('#vrefresh').classList.add('spin');

/* 3D-модель игрока на CSS: части тела — коробки, текстуры берутся из скина по стандартной раскладке */
function skinViewer(host, o){

      [u0+d+w, v0+d, d, h, D, H, `rotateY(90deg) translateZ(${W*K/2}px)`],
      [u0+d, v0, w, d, W, D, `rotateX(90deg) translateZ(${H*K/2}px)`],

  part({x:-(4 + aw/2), y:-8, cy:6, w:aw, h:12, d:4, u:40, v:16, ou:40, ov:32, cls:'sw-a'}, 'rightArm', ubody, -4);
  part({x:(4 + aw/2), y:-8, cy:6, w:aw, h:12, d:4, u:32, v:48, ou:48, ov:48, cls:'sw-b'}, 'leftArm', ubody, -4);

  part({x:2, y:4, cy:6, w:4, h:12, d:4, u:16, v:48, ou:0, ov:48, cls:'sw-a'}, 'leftLeg', body, 0);
  if (o.cape) {
    const pos = mk('mc-abs', `transform:translate3d(0,${-12*K}px,${-2*K}px) rotateX(-9deg)`), hold = mk('mc-abs', `transform:translate3d(0,${8*K}px,${-.5*K}px) rotateY(180deg)`);

  };
}

/* описание мода прямо в лаунчере */
function md(src){
  let t = String(src || '');
  t = t.replace(/<img[^>]*src=["']([^"']+)["'][^>]*>/gi, '\n![]($1)\n').replace(/<a[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi, '[$2]($1)')
    .replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|h\d|li|tr)>/gi, '\n').replace(/<h(\d)[^>]*>/gi, (m, n) => '\n' + '#'.repeat(+n) + ' ').replace(/<li[^>]*>/gi, '\n- ').replace(/<\/?[a-z][^>]*>/gi, '');
  const blocks = [];
  t = t.replace(/```[^\n]*\n([\s\S]*?)```/g, (m, c) => { blocks.push(c); return `\n@@B${blocks.length - 1}@@\n`; });
  const inl = x => x.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)[^)]*\)/g, '<img src="$2" alt="$1" loading="lazy">').replace(/\[([^\]]+)\]\((https?:[^)\s]+)[^)]*\)/g, '<a data-u="$2">$1</a>')
    .replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of esc(t).split('\n')) {
    const line = raw.trim(); let m;
    if (!line) { close(); continue; }
    if ((m = line.match(/^@@B(\d+)@@$/))) { close(); out.push(`<pre>${esc(blocks[+m[1]])}</pre>`); continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { close(); out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); continue; }
    if ((m = line.match(/^[-*+]\s+(.*)$/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inl(m[1])}</li>`); continue; }
    if ((m = line.match(/^\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inl(m[1])}</li>`); continue; }
    close(); out.push(`<p>${inl(line)}</p>`);
  }
  close(); return out.join('');
}

/* разбор вылетов: ищем в логе, чего не хватает, и предлагаем найти нужный мод */
function analyzeCrash(t){
  const out = [], seen = new Set(); let m;
  const add = (kind, key, o) => { if (seen.has(kind + key)) return; seen.add(kind + key); out.push({kind, key, ...o}); };
  const reInst = /(?:^|\n)\s*-\s*Install ([A-Za-z0-9_.\-]+)/g;
  while ((m = reInst.exec(t))) add('missing', m[1], {title: `Нужен мод «${m[1]}»`, text: 'Загрузчик подсказывает, что этот мод нужно установить.', q: m[1]});
  const reReq = /Mod '([^']+)' \(([^)]+)\)[^\n]*?requires[^\n]*?mod '([^']+)' \(([^)]+)\)/g;
  while ((m = reReq.exec(t))) add('missing', m[4], {title: `Моду «${m[1]}» нужен «${m[3]}»`, text: 'Без этого мода игра не запустится. Установи его или убери «' + m[1] + '».', q: m[3]});
  const reRep = /(?:Replace|Update) mod '([^']+)' \(([^)]+)\)/g;
  while ((m = reRep.exec(t))) add('update', m[2], {title: `Мод «${m[1]}» устарел или не подходит`, text: 'Найди версию, подходящую под эту версию игры, или удали мод.', q: m[1]});
  const reForge = /Mod ID: '([^']+)', Requested by: '([^']+)', Expected range: '([^']+)', Actual version: '([^']+)'/g;
  while ((m = reForge.exec(t))) { if (/MISSING/i.test(m[4])) add('missing', m[1], {title: `Моду «${m[2]}» нужен «${m[1]}»`, text: 'Требуемый мод не установлен.', q: m[1]}); else add('update', m[1], {title: `Мод «${m[1]}» не той версии`, text: `«${m[2]}» ждёт версию ${m[3]}, а стоит ${m[4]}.`, q: m[1]}); }
  const reMix = /Mixin (?:apply|transformation|config)[^\n]*?(?:mod|from|for) ['"]?([A-Za-z0-9_.\-]+)/g;
  while ((m = reMix.exec(t))) add('mixin', m[1], {title: `Конфликт мода «${m[1]}»`, text: 'Мод не смог встроиться в игру: обычно помогает обновление или удаление конфликтующего мода.', q: m[1]});
  if (/OutOfMemoryError/.test(t)) add('ram', 'oom', {title: 'Не хватило памяти', text: 'Увеличь объём ОЗУ для игры в настройках.'});
  if (/UnsupportedClassVersionError|class file version \d+/.test(t)) add('java', 'ver', {title: 'Мод требует более новую Java', text: 'Один из модов собран под другую версию Java. Обнови мод или смени версию игры.'});
  if (/GLFW error|Pixel format not accelerated|GLX|failed to create (?:the )?window/i.test(t)) add('gl', 'gl', {title: 'Проблема с графикой', text: 'Игра не смогла создать окно OpenGL. Проверь драйвер видеокарты и попробуй отключить шейдеры и OptiFine.'});
  return out;
}
async function crashHelp(auto, code){
  let text = ''; try { text = (await invoke('get_logs')).join('\n'); } catch (e) {}
  const sugs = analyzeCrash(text), pid = S.sel;
  if (!sugs.length) { if (auto) modal('Игра закрылась с ошибкой', `Код выхода: ${code}. Подробности в консоли на главной странице.`); else toast('Явных причин в логе не нашлось'); return; }
  const html = sugs.map((x, i) => `<div class="sug"><div><b>${esc(x.title)}</b><small>${esc(x.text)}</small></div>${x.kind === 'ram' ? '<button class="minibtn solid sm" data-set>Настройки</button>' : x.q ? `<button class="minibtn solid sm" data-find="${i}">Найти мод</button>` : ''}</div>`).join('');
  const ready = modalHtml(auto ? 'Игра закрылась с ошибкой' : 'Что нашлось в логе', `<div class="hint" style="margin-bottom:6px">Вот что похоже на причину:</div>${html}`, [{label:'Закрыть', val:true}]);
  setTimeout(() => {
    $$('#mx [data-find]').forEach(b => b.onclick = () => { const x = sugs[+b.dataset.find]; $('#modal').classList.remove('on'); Object.assign(S.m, {profile: pid, tab: 'catalog', src: 'all', kind: 'mod', q: x.q, hits: [], offset: 0, err: null, client: 'all'}); go('mods'); });
    $$('#mx [data-set]').forEach(b => b.onclick = () => { $('#modal').classList.remove('on'); go('settings'); });
  }, 30);
  await ready;
}

const idleNow = () => document.hidden || !document.hasFocus();
function applyIdle(){ document.documentElement.classList.toggle('idle', idleNow()); }
['visibilitychange', 'focus', 'blur'].forEach(e => (e === 'visibilitychange' ? document : window).addEventListener(e, applyIdle)); applyLite(); applyIdle();

/* ── события ── */
T.event.listen('task', ({payload: t}) => {
  if (String(t.id).startsWith('pack:')) return;
  if (String(t.id).startsWith('mod:')) { if (S.creating && t.detail) { S.cstat = 'ставлю: ' + t.detail; const c = $('#cstat'); if (c) c.textContent = S.cstat; } return; }
  S.task = t; setProgress();
});
T.event.listen('game', ({payload: g}) => {
  if (g.state === 'installing') S.game = {id: g.id, state: 'installing'};
  else if (g.state === 'running') { S.game = {id: g.id, state: 'running'}; S.runStart = Date.now(); }
  else if (g.state === 'exited') { S.game = {id: null, state: 'idle'}; if (g.code && g.code !== 0) { S.logOpen = true; crashHelp(true, g.code); } else toast('Игра закрыта'); }
  else if (g.state === 'installed') { S.game = {id: null, state: 'idle'}; toast('Версия скачана и готова к запуску'); }
  else if (g.state === 'error') { S.game = {id: null, state: 'idle'}; modal('Что-то пошло не так', g.message); }
  setDot(); renderProfiles(); renderHero();
});
T.event.listen('log', ({payload: lines}) => {
  const pre = $('#logpre'); if (!pre) return;
  const atEnd = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
  pre.append(document.createTextNode((pre.textContent ? '\n' : '') + lines.join('\n')));
  if (pre.textContent.length > 400000) pre.textContent = pre.textContent.slice(-300000);
  if (atEnd) pre.scrollTop = pre.scrollHeight;
});
T.event.listen('profiles-changed', () => loadProfiles());
T.event.listen('game', ({payload: p}) => { if (p && p.state === 'agent-off') { modal('Игра упала из-за помощника Noxel', 'Автовход, автоскин и значок игры отключены, чтобы игра запускалась. Запусти её снова. Включить их обратно можно в настройках, а ошибку лучше передать разработчику.'); if (S.set) { S.set.auto_auth = false; S.set.auto_skin = false; S.set.game_icon = false; } } });
T.event.listen('autoauth', ({payload: p}) => toast(p.kind === 'register' ? `Автовход: регистрация на ${p.host}` : p.kind === 'login' ? `Автовход: вход на ${p.host}` : `Скин отправлен на ${p.host}`));
/* перетаскивание своих файлов */
T.event.listen('tauri://drag-enter', () => { if (S.page === 'mods') { const d = $('#drop'); if (d) d.classList.add('on'); } });
T.event.listen('tauri://drag-leave', () => { const d = $('#drop'); if (d) d.classList.remove('on'); });
T.event.listen('tauri://drag-drop', ({payload}) => {
  const d = $('#drop'); if (d) d.classList.remove('on'); const ps = payload.paths || []; if (!ps.length) return;
  if (S.page === 'mods') addOwn(ps);
  else if (S.page === 'accounts' && S.av) { if (/\.png$/i.test(ps[0])) skinAction(() => invoke('skin_apply', {id: S.av, path: ps[0], model: S.skinModel === 'auto' ? null : S.skinModel}), 'Скин обновлён'); else toast('Нужен PNG-файл со скином'); }
});

/* ── старт ── */
$('#addProfile').onclick = () => go('versions');
$('#vq').oninput = e => { S.vq = e.target.value; renderVersions(); };
$('#vrefresh').onclick = () => loadVersions(true);
(async () => {
  const t0 = performance.now();
  try {
    S.set = await invoke('settings_get'); S.sys = await invoke('sys_info'); applyAnim();
    S.presets = await invoke('presets');
    S.sel = S.set.last_profile || null;
    const st = await invoke('game_status');
    if (st.busy) S.game = {id: st.running, state: st.running ? 'running' : 'installing'};
    await loadAccounts(); await loadProfiles(); go(S.sys.start_page || 'home'); setDot();
  } catch (e) { modal('Ошибка запуска', String(e)); }
  setTimeout(() => checkLauncher(true), 5000);
  const wait = S.set && S.set.animations ? Math.max(0, 1500 - (performance.now() - t0)) : 0;
  setTimeout(() => { const s = $('#splash'); s.classList.add('gone'); setTimeout(() => s.remove(), 800); }, wait);
})();
</script>
</body>
</html>
